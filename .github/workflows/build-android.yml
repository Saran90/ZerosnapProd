name: Build Android Release

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - appbundle
          - both

permissions:
  contents: write  # Required for creating releases

jobs:
  build:
    name: Build Android Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - name: Get Flutter dependencies
        run: flutter pub get
      
      - name: Run code generation (if needed)
        run: |
          if grep -q "build_runner" pubspec.yaml; then
            flutter pub run build_runner build --delete-conflicting-outputs
          fi
      
      - name: Build APK
        if: ${{ inputs.build_type == 'apk' || inputs.build_type == 'both' }}
        run: flutter build apk --release --split-per-abi
      
      - name: Build App Bundle
        if: ${{ inputs.build_type == 'appbundle' || inputs.build_type == 'both' }}
        run: flutter build appbundle --release
      
      - name: Get version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d '\r')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Upload APK artifacts
        if: ${{ inputs.build_type == 'apk' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-v${{ steps.version.outputs.version }}
          path: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 30
      
      - name: Create GitHub Release and Upload APK
        if: ${{ inputs.build_type == 'apk' || inputs.build_type == 'both' }}
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}-${{ github.run_number }}
          name: Build v${{ steps.version.outputs.version }} (${{ github.run_number }})
          draft: false
          prerelease: true
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          body: |
            ## Android Build v${{ steps.version.outputs.version }}
            
            **Build Number:** ${{ github.run_number }}
            **Branch:** ${{ github.ref_name }}
            **Commit:** ${{ github.sha }}
            **Build Type:** ${{ inputs.build_type }}
            
            ### Download APK
            - [arm64-v8a (64-bit, recommended)](https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}-${{ github.run_number }}/app-arm64-v8a-release.apk)
            
            ### Installation
            1. Download the APK on your Android device
            2. Enable "Install from Unknown Sources" in Settings
            3. Open the downloaded APK and install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Generate QR Code for APK Download
        if: ${{ inputs.build_type == 'apk' || inputs.build_type == 'both' }}
        run: |
          APK_URL="https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}-${{ github.run_number }}/app-arm64-v8a-release.apk"
          
          # Install qrencode
          sudo apt-get update
          sudo apt-get install -y qrencode
          
          # Generate QR code as PNG
          qrencode -o qr-code.png -s 10 -m 2 "$APK_URL"
          
          # Generate QR code as ASCII art for console
          echo "## QR Code for APK Download" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          qrencode -t ANSI256 "$APK_URL" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Direct Download Link:**" >> $GITHUB_STEP_SUMMARY
          echo "$APK_URL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Scan the QR code above with your Android device to download and install the APK." >> $GITHUB_STEP_SUMMARY
      
      - name: Upload QR Code as Artifact
        if: ${{ inputs.build_type == 'apk' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: qr-code-v${{ steps.version.outputs.version }}
          path: qr-code.png
          retention-days: 30
      
      - name: Upload App Bundle artifact
        if: ${{ inputs.build_type == 'appbundle' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-appbundle-v${{ steps.version.outputs.version }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
      
      - name: Build summary
        run: |
          echo "### Build Completed ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Build Type:** ${{ inputs.build_type }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.build_type }}" == "apk" ] || [ "${{ inputs.build_type }}" == "both" ]; then
            echo "📱 **APK Download:** Check the QR code above or download from [Releases](https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.version }}-${{ github.run_number }})" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 **Artifacts:** Available in the Artifacts section above" >> $GITHUB_STEP_SUMMARY
