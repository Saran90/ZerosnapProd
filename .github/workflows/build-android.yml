name: Build Android Release

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - appbundle
          - both

permissions:
  contents: write  # Required for creating releases

jobs:
  build:
    name: Build Android Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - name: Get Flutter dependencies
        run: flutter pub get
      
      - name: Run code generation (if needed)
        run: |
          if grep -q "build_runner" pubspec.yaml; then
            flutter pub run build_runner build --delete-conflicting-outputs
          fi
      
      - name: Build APK
        if: ${{ inputs.build_type == 'apk' || inputs.build_type == 'both' }}
        run: flutter build apk --release --split-per-abi
      
      - name: Build App Bundle
        if: ${{ inputs.build_type == 'appbundle' || inputs.build_type == 'both' }}
        run: flutter build appbundle --release
      
      - name: Get version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d '\r')
          # Extract just the version name (before the +build number)
          VERSION_NAME=$(echo "$VERSION" | cut -d'+' -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Rename APK
        if: ${{ inputs.build_type == 'apk' || inputs.build_type == 'both' }}
        run: |
          APK_DIR="build/app/outputs/flutter-apk"
          VERSION_NAME="${{ steps.version.outputs.version_name }}"
          mv "$APK_DIR/app-arm64-v8a-release.apk"  "$APK_DIR/PF-Checkin-v${VERSION_NAME}-arm64.apk"
          mv "$APK_DIR/app-armeabi-v7a-release.apk" "$APK_DIR/PF-Checkin-v${VERSION_NAME}-armv7.apk"
          mv "$APK_DIR/app-x86_64-release.apk"      "$APK_DIR/PF-Checkin-v${VERSION_NAME}-x86_64.apk"
      
      - name: Upload APK artifacts
        if: ${{ inputs.build_type == 'apk' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: PF-Checkin-v${{ steps.version.outputs.version_name }}
          path: |
            build/app/outputs/flutter-apk/PF-Checkin-v${{ steps.version.outputs.version_name }}-arm64.apk
            build/app/outputs/flutter-apk/PF-Checkin-v${{ steps.version.outputs.version_name }}-armv7.apk
            build/app/outputs/flutter-apk/PF-Checkin-v${{ steps.version.outputs.version_name }}-x86_64.apk
          retention-days: 30
      
      - name: Create GitHub Release and Upload APK
        if: ${{ inputs.build_type == 'apk' || inputs.build_type == 'both' }}
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}-${{ github.run_number }}
          name: Build v${{ steps.version.outputs.version }} (${{ github.run_number }})
          draft: false
          prerelease: true
          files: |
            build/app/outputs/flutter-apk/PF-Checkin-v${{ steps.version.outputs.version_name }}-arm64.apk
          body: |
            ## Android Build v${{ steps.version.outputs.version }}
            
            **Build Number:** ${{ github.run_number }}
            **Branch:** ${{ github.ref_name }}
            **Commit:** ${{ github.sha }}
            **Build Type:** ${{ inputs.build_type }}
            
            ### 📱 Quick Install via QR Code
            Download the QR code image from the assets below, then scan it with your phone to download and install the APK directly.
            
            ### 📥 Direct Download
            - [Download APK (arm64, recommended for most phones)](https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}-${{ github.run_number }}/PF-Checkin-v${{ steps.version.outputs.version_name }}-arm64.apk)
            
            ### Installation Instructions
            1. Download the APK on your Android device
            2. Enable "Install from Unknown Sources" in Settings → Security
            3. Open the downloaded APK file
            4. Tap "Install"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Generate QR Code for APK Download
        if: ${{ inputs.build_type == 'apk' || inputs.build_type == 'both' }}
        run: |
          APK_URL="https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}-${{ github.run_number }}/PF-Checkin-v${{ steps.version.outputs.version_name }}-arm64.apk"
          
          # Install qrencode
          sudo apt-get update
          sudo apt-get install -y qrencode
          
          # Generate QR code as PNG (larger size for better scanning)
          qrencode -o qr-code-download.png -s 15 -m 4 "$APK_URL"
          
          # Also generate ASCII for logs
          echo "QR Code generated for: $APK_URL"
          qrencode -t ANSI256 "$APK_URL"
      
      - name: Upload QR Code to Release
        if: ${{ inputs.build_type == 'apk' || inputs.build_type == 'both' }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}-${{ github.run_number }}
          files: qr-code-download.png
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload QR Code as Artifact
        if: ${{ inputs.build_type == 'apk' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: qr-code-v${{ steps.version.outputs.version }}
          path: qr-code-download.png
          retention-days: 30
      
      - name: Upload App Bundle artifact
        if: ${{ inputs.build_type == 'appbundle' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-appbundle-v${{ steps.version.outputs.version }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
      
      - name: Build summary
        run: |
          echo "### Build Completed ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Build Type:** ${{ inputs.build_type }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.build_type }}" == "apk" ] || [ "${{ inputs.build_type }}" == "both" ]; then
            echo "### 📱 Installation Options" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "1. **QR Code**: Download \`qr-code-download.png\` from [Release Assets](https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.version }}-${{ github.run_number }}) and scan with your phone" >> $GITHUB_STEP_SUMMARY
            echo "2. **Direct Link**: [Download APK](https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}-${{ github.run_number }}/PF-Checkin-v${{ steps.version.outputs.version_name }}-arm64.apk)" >> $GITHUB_STEP_SUMMARY
            echo "3. **Artifacts**: Download from the Artifacts section above" >> $GITHUB_STEP_SUMMARY
          fi
